<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Application Form</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="container">
    <form>
        <label for="name">Nama Lengkap:</label>
        <input type="text" id="name" name="name" placeholder="cnth: RISKA AULIA"> <br>
        <label for="email">Email Aktif:</label>
        <input type="email" id="email" name="email" placeholder="cnth: ikagemec@gmail.com"> <br>
        <label for="position">Posisi Pekerjaan:</label>
        <select id="position">
            <option value="">--Pilih Pekerjaan--</option>
            <option value="it">IT</option>
            <option value="desainer">Desainer</option>
            <option value="layanan_pelanggan">Layanan Pelanggan</option>
        <select>

            <fieldset class="radio-group">
                <input type="radio" name="availability" id="full-time">
                 <label for="full-time">Full-Time</label >
                <input type="radio" name="availability" id="part-time">
                <label for="part-time">Part-Time</label>
            </fieldset>
            <label for="message">Pesan:</label> <br>
            <textarea id="message"></textarea> <br>
            <button type="submit">Kirim</button>
    </form>
</div>
</body>
</html>
